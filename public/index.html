<!doctype html>
<head>
    <meta charset="utf-8">
    <title>HexaRoll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        h1 {
            font-family: 'Rosarivo', sans-serif;
            font-size: 5rem;
            display: inline-flex;
            align-items: center;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            background-image: url("images/autumn_pixelized.png");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;

            align-items: center;
            justify-content: center;
        }

        #usernameBg {
            display: flex;
            background-image: url("images/paper_texture.png");
            background-color: #F5F5DC;

            box-shadow: 8px 8px 0 0 rgba(19, 22, 33, 100);

            width: 50%;
            height: 70%;

            border: 2px solid #000000;
            padding: 3% 5%;

            box-sizing: border-box;
            flex-direction: column;
        }

        #diceImage {
            max-width: 60px;
            max-height: 60px;
            margin: 0 auto;
            vertical-align: bottom;
        }

        #title {
            display: flex;
            flex-direction: row;
            gap: 2px;
        }

    </style>
</head>
<body>
    <div id="usernameBg">
        <div id="title"> <h1> <span>HexaR</span> <img src="images/dice1.webp" id="diceImage"> <span>LL</span> </h1> </div>
        <form id="usernameForm" onsubmit="onUsernameSubmit(event)">
            <label>Username: </label> <br>
            <input type="text"; id="username"; name="username">
        </form>
    </div>
</body>
<script>
    

    const form = document.getElementById("usernameForm");
    const name = document.getElementById("username");

    function onUsernameSubmit(event) {
        event.preventDefault();
        if (name.value.trim() === "") {
            return
        }

        window.location.href = "game.html";
    }

</script>
