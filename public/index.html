<!doctype html>
<head>
    <meta charset="utf-8">
    <title>HexaDraw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">

    <style>
        html, body {
            background-color: #F5F5DC;
            scrollbar-width: none; !important;
            -ms-overflow-style: none; !important;
        }

        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none; !important;
            width: 0 !important;
            height: 0 !important;
        }
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
        }

        h1 {
            font-family: 'Rosarivo', sans-serif;
            font-size: 5rem;
            display: inline-flex;
            align-items: center;
            padding: 0;
        }

        p {
            font-family: "JetBrains Mono", monospace;
            padding-left: 30px;
            margin-top: 0;
        }

        body {
            margin: 0;
            padding: 10% 0;
            min-height: 100%;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            flex-direction: column;

            background-image: url("images/autumn_pixelized.png");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;

            align-items: center;
        }


        #usernameBg {
            display: flex;
            background-image: url("images/paper_texture.png");
            background-color: #F5F5DC;

            box-shadow: 8px 8px 0 0 rgba(19, 22, 33, 100);

            width: 50%;
            height: 80vh;

            border: 2px solid #000000;
            padding: 1% 5%;
            margin-bottom: 5vh;

            box-sizing: border-box;
            flex-direction: column;
        }

        #informationBg {
            display: flex;
            background-image: url("images/paper_texture.png");
            background-color: #F5F5DC;

            box-shadow: 8px 8px 0 0 rgba(19, 22, 33, 100);

            width: 50%;
            height: 85%;

            border: 2px solid #000000;
            padding: 1% 5%;

            box-sizing: border-box;
            flex-direction: column;
        }

        #diceImage {
            max-width: 60px;
            max-height: 60px;
            margin: 0 auto;
            vertical-align: bottom;
        }

        #title {
            display: flex;
            flex-direction: row;
        }

        input {
            font-family: "JetBrains Mono", monospace;
            margin-top: 5px;
            padding: 5px;
        }

        #mainMenuContainer {
            display: flex;
            flex-direction: row;
        }

        #left {
            border-right: black solid 1px;
        }

        #right {
            border-left: black solid 1px;
        }

        #left, #right {
            width: 50%;
            height: 100%;
            padding: 20px 0px;
        }

        #createRoomButton {
            font-family: "JetBrains Mono", monospace;
            font-size: 2rem;

            padding: 10px;
            width: 80%;
            height: 70px;

            margin-bottom: 30px;

            box-shadow: 4px 4px 0 0 rgba(19, 22, 33, 100);
        }

        #verticalRoomButtonsContainer {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
        }

        #joinByCodeButton {
            font-family: "JetBrains Mono", monospace;
            font-size: 2rem;

            width: 33%;
            height: 70px;

            margin-bottom: 20px;

            box-shadow: 4px 4px 0 0 rgba(19, 22, 33, 100);
        }

        #roomCode {
            width: 40%;
            font-size: 2rem;

            padding-top: 12px;
            padding-bottom: 12px;
        }

    </style>
</head>
<body>
    <div id="usernameBg">
        <div id="title"> <h1> <span>HexaDraw</span> </h1> </div>
        <div id="mainMenuContainer">
            <div id="left">
                <form id="usernameForm" onsubmit="cancelUsername(event)">
                    <label>Your Name </label> <br>
                    <input type="text" id="username" name="username">
                </form>
                <div id="verticalRoomButtonsContainer">
                    <hr style="border: none; border-top: 2px dashed black; width: 90%; margin-left: 0; padding-bottom: 20px">
                    <label>Host</label>
                    <button type="button" id="createRoomButton">HOST A ROOM</button>
                    <label>Join By Code</label>
                    <form id="roomCodeForm">
                        <input type="text" id="roomCode" name="roomCode" placeholder="HXDW">
                        <button type="button" id="joinByCodeButton">JOIN</button>
                    </form>
                </div>
            </div>
            <div id="right">
                <p>Public Rooms</p>
            </div>
        </div>
    </div>
    <div id="informationBg"></div>
</body>
<script>
    const socket = new WebSocket(location.origin.replace("http", "ws"));
    const me = Math.random().toString(36).slice(2);
    const form = document.getElementById("usernameForm");
    const name = document.getElementById("username");

    const createButton = document.getElementById("createRoomButton");
    const joinByCodeButton = document.getElementById("joinByCodeButton");
    const roomId = document.getElementById("roomCode");

    function cancelUsername(event) {
        event.preventDefault();
    }

    createButton.addEventListener("click", onCreateRoom);
    joinByCodeButton.addEventListener("click", onJoinByCode);

    function onJoinByCode() {
        if (name.value.trim() === "") {
            return
        }

        const joinRoom = {
            type: "JOIN_ROOM",
            payload: { joinRoomId: roomId.value, joinClientId: me },
        }

        socket.send(JSON.stringify(joinRoom));
    }

    function onCreateRoom() {
        if (name.value.trim() === "") {
            return
        }

        const createRoom = {
            type: "CREATE_ROOM",
            payload: { clientId: me }
        }

        socket.send(JSON.stringify(createRoom));

        sessionStorage.setItem("username", name.value)
        sessionStorage.setItem("id", me)

        // window.location.href = "game.html";
    }

    socket.addEventListener("message", (e) => {
        try {
            const data = JSON.parse(e.data);
            switch (data.type) {
                case "RETURN_ROOM_ID":
                    const { id } = data.payload;
                    sessionStorage.setItem("roomId", id);
                    window.location.href = "game.html";
                    break;
                case "CONFIRM_JOIN_ROOM":
                    const { roomId } = data.payload;
                    sessionStorage.setItem("username", name.value)
                    sessionStorage.setItem("id", me)
                    sessionStorage.setItem("roomId", roomId)
                    sessionStorage.setItem("previousSocket", socket)
                    window.location.href = "game.html";
                    break;
            }
        } catch (e) {
            console.log("Failed to parse incoming message:", error);
        }
    });

</script>
