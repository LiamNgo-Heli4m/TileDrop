<!doctype html>
<head>
    <meta charset="utf-8">
    <title>HexaDraw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <style>
        html, body {
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #F5F5DC;
        }

        canvas {
            background: #F5F5DC;
            display: block;
            outline: none;
            position: absolute;
            border: none !important;
        }

        img {
            min-width: 100%;
            min-height: 100%;
        }

        #gameBox {
            isolation: isolate;
            display: flex;

            align-items: center;
            justify-content: center;
            height: 1200px;
            width: 1000px;
            border: black solid 3px;
        }

        #canvasHolder {
            width: 900px;
            height: 900px;

            display: grid;
            position: relative;
            place-items: center;
            border: none;
        }

        #canvasHolder > canvas {
            grid-area: 1 / 1;
            background: transparent;
            display: block;
            outline: none;
        }

        #canvasBack {
            z-index: 1;
            background: #F5F5DC;
        }

        #canvasFront {
            z-index: 2;
            background: transparent;
        }

        #roomCodeHolder {
            font-family: "JetBrains Mono", monospace;
            font-size: 2rem;
            position: fixed;
            top: 10px;
            right: 40px;
            z-index: 1000;
        }

        #gameHolder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 1000px;
            margin: 0 auto;
            isolation: isolate;
        }

        #waitingRoomHolder {
            justify-content: center;
            align-items: center;
            display: flex;
            flex-direction: column;
            width: 75vw;
            height: 75vh;
            z-index: 10000;
            margin-top: 5vh;

            box-shadow: 8px 8px 0 0 rgba(19, 22, 33, 100);
            border: 2px solid #000000;

            background: #B2AC88;

            transition: transform 0.5s ease-in-out;

            pointer-events: auto;
        }

        #waitingRoomHolder.moved {
            transform: translate(100vw, 0);
            pointer-events: none;
        }

        #waitingRoomCenterer {
            position: absolute;
            display: flex;
            flex-direction: column;
            height: 100vh;
            z-index: 10000;

            pointer-events: none;
        }

        #bigRoomCodeHolder {
            font-family: "JetBrains Mono", monospace;
            font-size: 18rem;
            letter-spacing: 50px;
            margin: 0;
        }

        #buttonsHolder {
            display: flex;
            flex-direction: row;

            padding-top: 2vh;
            transition: transform 0.75s ease-in-out;

            pointer-events: auto;
        }

        #buttonsHolder.moved {
            transform: translate(-100vw, 0);
            pointer-events: none;
        }

        .waitingRoomButtons {
            font-family: "JetBrains Mono", monospace;
            font-size: 1.2rem;
            height: 5vh;

            background-color: #B2AC88;

            border-radius: 0;
            box-shadow: 8px 8px 0 0 rgba(19, 22, 33, 100);
            border: 2px solid #000000;
        }

        .buttonHover {
            background-color: #F5F5DC;
        }

        .notClickableButton {
            background-color: #ABA796;
            color: #404040;
        }

    </style>
</head>
<body>
    <p id="roomCodeHolder">CODE</p>
    <div id="gameHolder">
        <div id="gameBox">
            <div id="canvasHolder">
                <canvas width="900" height="700" style="border: 1px solid" id="canvasBack"></canvas>
                <canvas width="900" height="700" style="border: 1px solid" id="canvasFront"></canvas>
            </div>
        </div>
    </div>

    <div id="waitingRoomCenterer">
        <div id="waitingRoomHolder">
            <p style="font-family: 'JetBrains Mono', monospace; margin: 0 0 -50px;">Room Code</p>
            <h1 id="bigRoomCodeHolder"></h1>
        </div>
        <div id="buttonsHolder">
            <button class="waitingRoomButtons" style="margin-right: 10px; width: 5%" id="leaveButton"><i class="material-icons">logout</i></button>
            <button class="waitingRoomButtons" style="margin-left: 10px; width: 95%" id="startButton">START</button>
        </div>
    </div>

</body>
<script>
    let hasStarted = false;
    let isOwner = false;
    let playerCount = 0;

    const canvasBack = document.getElementById("canvasBack");
    const bctx = canvasBack.getContext("2d");

    const canvasFront = document.getElementById("canvasFront");
    const fctx = canvasFront.getContext("2d")

    const others = {};
    const socket = new WebSocket(location.origin.replace("http", "ws"));
    const username = sessionStorage.getItem("username");
    const me = sessionStorage.getItem("id");

    const a = 2 * Math.PI / 6;
    const r = 30;
    let hexPosArray = []

    const waitingRoomCenterer = document.getElementById("waitingRoomCenterer");
    const startButton = document.getElementById("startButton");
    const leaveButton = document.getElementById("leaveButton");

    const roomCode = document.getElementById("roomCodeHolder");
    const bigRoomCode = document.getElementById("bigRoomCodeHolder");
    let roomId = sessionStorage.getItem("roomId");
    roomId = roomId.toUpperCase()
    roomCode.textContent = roomId;
    bigRoomCode.textContent = roomId;

    let currentHoveredHex = null;
    let otherHoveredHexes = { }
    let selectedHex = null;
    let moveableHexes = [ ]
    let currentPlayerPosition = null;

    const playerColorPalettes = [
        { base: "#D32F2F", light: "#FF8A80", hover: "#FFCDD2" },
        { base: "#1976D2", light: "#64B5F6", hover: "#BBDEFB" },
        { base: "#388E3C", light: "#81C784", hover: "#C8E6C9" },
        { base: "#F57C00", light: "#FFB74D", hover: "#FFE0B2" },
        { base: "#7B1FA2", light: "#BA68C8", hover: "#E1BEE7" },
        { base: "#0097A7", light: "#4DD0E1", hover: "#B2EBF2" },
        { base: "#C2185B", light: "#F06292", hover: "#F8BBD0" },
        { base: "#5D4037", light: "#A1887F", hover: "#D7CCC8" },
        { base: "#FBC02D", light: "#FFEE58", hover: "#FFF59D" },
        { base: "#455A64", light: "#90A4AE", hover: "#CFD8DC" },
        { base: "#0D47A1", light: "#42A5F5", hover: "#90CAF9" },
        { base: "#689F38", light: "#AED581", hover: "#DCEDC8" },
        { base: "#AD1457", light: "#EC407A", hover: "#FCE4EC" },
        { base: "#3F51B5", light: "#7986CB", hover: "#C5CAE9" },
        { base: "#00796B", light: "#4DB6AC", hover: "#B2DFDB" },
        { base: "#E64A19", light: "#FF8A65", hover: "#FFCCBC" }
    ];

    const selectedPallete = playerColorPalettes[Math.floor(Math.random() * playerColorPalettes.length)];
    const dotColour = selectedPallete.base

    startButton.classList.add("notClickableButton")

    canvasFront.addEventListener("pointermove", (e) => {
        const closestHex = checkMousePosition(e)
        currentHoveredHex = closestHex ? { x: closestHex.xValue + 10, y: closestHex.yValue + 5, color: selectedPallete.hover } : null;
        const positionData = {
            type: "UPDATE_MOUSE_POSITION",
            payload: { id: me, x: e.offsetX, y: e.offsetY, colour: dotColour, name: username, hoveredHex: currentHoveredHex, clientRoomId: roomId },
        }
        if (socket.readyState !== WebSocket.OPEN) return;
        socket.send(JSON.stringify(positionData));
    });

    startButton.addEventListener("click", (e) => {
        const requestStart = {
            type: "REQUEST_GAME_START",
            payload: { id: me, roomId: roomId },
        }

        socket.send(JSON.stringify(requestStart));
    })

    function animateAfterStarting() {
        const waitingRoomHolder = document.getElementById("waitingRoomHolder");
        waitingRoomHolder.classList.toggle("moved");

        const buttonsHolder = document.getElementById("buttonsHolder");
        buttonsHolder.classList.toggle("moved");
    }

    socket.onopen = () => {
        const requestSocketReconnection = {
            type: "REQUEST_SOCKET_RECONNECTION",
            payload: { reconnectRequestId: me, reconnectRequestRoomId: roomId },
        }

        const sendHexaGridInformation = {
            type: "HEXAGRID_INFO",
            payload: { hexaGrid: hexPosArray },
        }

        const requestOwnerInformation = {
            type: "OWNER_INFO",
            payload: { id: me, roomId: roomId },
        }

        socket.send(JSON.stringify(sendHexaGridInformation));
        socket.send(JSON.stringify(requestOwnerInformation));
        socket.send(JSON.stringify(requestSocketReconnection));
    }

    socket.addEventListener("message", (e) => {
        try {
            const data = JSON.parse(e.data);

            switch (data.type) {
                case "REQUEST_CLIENT_ID": {
                    const identifier = {
                        type: "RETURN_CLIENT_ID",
                        payload: {id: me}
                    }
                    if (socket.readyState !== WebSocket.OPEN) return;
                    socket.send(JSON.stringify(identifier));
                    break;
                }
                case "UPDATE_MOUSE_POSITION": {
                    const {id, x, y, colour, name, hoveredHex} = data.payload;
                    others[id] = {x, y, colour, name};
                    otherHoveredHexes[id] = hoveredHex;
                    break;
                }
                case "DELETE_DISCONNECTED_ID": {
                    playerCount -= 1

                    if (playerCount <= 1) {
                        startButton.classList.add("notClickableButton")
                    }

                    const {deleteID} = data.payload;
                    delete others[deleteID];
                    break;
                }
                case "CONFIRM_OWNERSHIP": {
                    if (playerCount >= 2) {
                        startButton.classList.remove("notClickableButton");
                    }
                    isOwner = true
                    break;
                }
                case "CONFIRM_START": {
                    const { startPos } = data.payload;
                    currentPlayerPosition = startPos;
                    animateAfterStarting();

                    break;
                }
                case "NEW_PLAYER_INFO": {
                    playerCount += 1
                    startButton.classList.remove("notClickableButton");
                }
            }
        } catch (error) {
            console.log("Failed to parse incoming message:", error);
        }
    });

    document.addEventListener("click", (e) => {
        selectedHex = currentHoveredHex;
        moveableHexes = acquireSurroundingHexes(selectedHex);
    })

    function acquireSurroundingHexes(selectedHex) {
        const hexArray = []
        const yPos = selectedHex ? Math.round(selectedHex.y) - 5 : null; // 5 cuz the y (and x but x doesnt matter) values are offsetted
        let isEven = false
        for (const array of hexPosArray) {
            const hexodd = array[1]
            const hexeven = array[0]

            const checkOddYValue = hexodd ? Math.round(hexodd.yValue) === yPos : false;
            const checkEvenYValue = hexeven ? Math.round(hexeven.yValue) === yPos : false;

            if (checkOddYValue || checkEvenYValue) {
                isEven = checkEvenYValue;
                const id = array.findIndex(hex => hex !== null && hex.xValue === selectedHex.x - 10);
                const arrayId = hexPosArray.indexOf(array)

                const arrayAbove = hexPosArray[arrayId - 1]
                const arrayBelow = hexPosArray[arrayId + 1]

                hexArray.push(array[id-1]);
                hexArray.push(array[id+1]);
                hexArray.push(arrayAbove ? arrayAbove[id] : null);
                hexArray.push(arrayBelow ? arrayBelow[id] : null);

                if (isEven) {
                    hexArray.push(arrayAbove ? arrayAbove[id - 1] : null);
                    hexArray.push(arrayAbove ? arrayAbove[id + 1] : null);
                } else {
                    hexArray.push(arrayBelow ? arrayBelow[id - 1] : null);
                    hexArray.push(arrayBelow ? arrayBelow[id + 1] : null);
                }

                break;
            }
        }

        return hexArray;
    }

    let isBackgroundDrawn;
    function drawBg() {
        if (isBackgroundDrawn) { return;}

        drawGrid(canvasBack.width, canvasBack.height);

        isBackgroundDrawn = true;
    }
    drawBg();

    function draw() {
        fctx.clearRect(0, 0, canvasFront.width, canvasFront.height);
        for (const hexobj of Object.values(otherHoveredHexes)) {
            drawHexagon( fctx, hexobj.x, hexobj.y, hexobj.color, true );
        }
        for (const hex of moveableHexes) {
            if (hex) { drawHexagon(fctx, hex.xValue + 10, hex.yValue + 5, selectedPallete.light, true); }
        }
        if (currentHoveredHex) { drawHexagon(fctx, currentHoveredHex.x, currentHoveredHex.y, selectedPallete.hover, true); }
        if (selectedHex) { drawPlayer(fctx, selectedHex.x, selectedHex.y, "#000000"); }
        if (currentPlayerPosition) { drawPlayer(fctx, currentPlayerPosition.xValue + 10, currentPlayerPosition.yValue + 5, selectedPallete.base); }
        drawOtherMice()
        requestAnimationFrame(draw);
    }

    function drawOtherMice() {
        for (const { x, y, colour, name } of Object.values(others)) {
            fctx.beginPath();
            fctx.arc(x, y, 5, 0, Math.PI * 2);
            fctx.fillStyle = colour;
            fctx.fill();

            fctx.font = "10px JetBrains Mono";
            fctx.fillText(name, x - (name.length / 3) * 10, y + 20)
        }
    }

    function drawGrid(width, height) {
        for (let y = r; y + (r * 3) < height; y += r * Math.sin(a)) {
            const currentRow = []
            if (y + r * 4 > height) {
                for (let x = r, j = 0; x + r < width; x += r * (1 + Math.cos(a)), 1 ** j++ * r * Math.sin(a)) {
                    if (j % 2 === 0) {
                        const posObj = {xValue: x, yValue: y}
                        currentRow.push(posObj)
                        drawHexagon(bctx, x + 10, y + 5, selectedPallete.hover, false);
                    } else {
                        currentRow.push(null)
                    }
                }

                hexPosArray.push(currentRow);
                continue
            }

            for (let x = r, j = 0; x + r < width; x += r * (1 + Math.cos(a)), y += (-1) ** j++ * r * Math.sin(a)) {

                const posObj = {xValue: x, yValue: y}
                currentRow.push(posObj)
                drawHexagon(bctx, x + 10, y + 5, selectedPallete.hover, false);
            }

            hexPosArray.push(currentRow);
        }

        console.log(hexPosArray);
    }

    function drawHexagon(ctx, x, y, color, fill) {
        ctx.beginPath();
        for (var i = 0; i < 6; i++) {
            ctx.lineTo(x + r * Math.cos(a * i), y + r * Math.sin(a * i));
        }
        ctx.closePath();
        if (fill) {
            fctx.fillStyle = color;
            ctx.fill()
        }
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    function drawPlayer(ctx, x, y, color) {
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
    }

    function checkMousePosition(event) {
        const rect = canvasFront.getBoundingClientRect();

        const mouseX = event.clientX - rect.left;
        const mouseY = event.clientY - rect.top;

        let closestHexPos;

        for (const hexArray of hexPosArray) {
            for (const hex of hexArray) {
                if (!hex) { continue; }
                const x = hex.xValue
                const y = hex.yValue
                const distance = calculatePointDistance(x, y, mouseX, mouseY);

                if (typeof closestHexPos !== "undefined" && closestHexPos !== null ) {
                    if (distance < closestHexPos.distance) {
                        closestHexPos = { xValue: x, yValue: y, distance: distance };
                    }
                } else {
                    closestHexPos = { xValue: x, yValue: y, distance: distance };
                }
            }
        }

        return closestHexPos;
    }

    function calculatePointDistance(x1, y1, x2, y2) {
        return Math.sqrt((x2 - x1)**2 + (y2 - y1)**2);
    }

    startButton.addEventListener("mouseover", (e) => {
        if (!isOwner) { return; }
        startButton.classList.add("buttonHover");
    })

    startButton.addEventListener("mouseout", (e) => {
        if (!isOwner) { return; }
        startButton.classList.remove("buttonHover");
    })

    leaveButton.addEventListener("mouseover", (e) => {
        leaveButton.classList.add("buttonHover");
    })

    leaveButton.addEventListener("mouseout", (e) => {
        leaveButton.classList.remove("buttonHover");
    })


    draw();
</script>
